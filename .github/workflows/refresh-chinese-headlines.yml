name: 手动刷新中文新闻标题

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install feedparser argostranslate==1.11.0

      - name: 抓取并翻译标题
        run: python fetch_news.py

      - name: 提交中文新闻列表
        run: |
          git config user.name "News Bot"
          git config user.email "news-bot@github.com"
          git add news.json news.md
          if git diff --cached --quiet; then
            echo "新闻列表没有变化"
          else
            git commit -m "📰 刷新中文新闻标题"
            git push
          fi
