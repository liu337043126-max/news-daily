name: GitHub schedule smoke test

on:
  workflow_dispatch:
  schedule:
    # Every five minutes, offset from the top of the hour to reduce load delays.
    - cron: '3/5 * * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Print trigger and run time
        run: |
          echo "event=${{ github.event_name }}"
          echo "scheduled_cron=${{ github.event.schedule }}"
          date -u '+UTC=%Y-%m-%dT%H:%M:%SZ'
